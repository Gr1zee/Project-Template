<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI + SQLAlchemy</title>
</head>
<body>
    <h1>Добавить новый элемент</h1>
    <form id="itemForm">
        <label for="price">Число:</label>
        <input type="number" id="price" name="price" required><br><br>
        <button type="submit">Добавить</button>
    </form>

    <h2>Список элементов</h2>
    <ul id="itemList"></ul>

    <script>
        // Функция для отправки данных на сервер
        document.getElementById('itemForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const item = {
                price: parseFloat(document.getElementById('price').value)
            };

            fetch('http://127.0.0.1:8000/items/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(item)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Успешно:', data);
                alert('Элемент добавлен в базу данных!');
                loadItems(); // Обновляем список элементов
            })
            .catch((error) => {
                console.error('Ошибка:', error);
                alert('Ошибка при добавлении элемента!');
            });
        });

        // Функция для загрузки и отображения списка элементов
        function loadItems() {
            fetch('http://127.0.0.1:8000/items/')
                .then(response => response.json())
                .then(data => {
                    const itemList = document.getElementById('itemList');
                    itemList.innerHTML = ''; // Очищаем список
                    data.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = `Число: ${item.price}`;
                        itemList.appendChild(li);
                    });
                })
                .catch((error) => {
                    console.error('Ошибка:', error);
                });
        }

        // Загружаем элементы при загрузке страницы
        window.onload = loadItems;
    </script>
</body>
</html>
